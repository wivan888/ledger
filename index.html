<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的帳本</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#17302d;--sub:#6b807c;--line:#dbe4e2;--acc:#0e6b61;--acc-ink:#fff;--out:#b4442a;--in:#0e6b61;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b19;--card:#172826;--ink:#e4efed;--sub:#8ba39f;--line:#27403c;--acc:#3fb5a6;--acc-ink:#06201c;--out:#f08a6e;--in:#3fb5a6}}
:root[data-theme="dark"]{--bg:#0f1b19;--card:#172826;--ink:#e4efed;--sub:#8ba39f;--line:#27403c;--acc:#3fb5a6;--acc-ink:#06201c;--out:#f08a6e;--in:#3fb5a6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:15px;margin:22px 0 8px;color:var(--sub);font-weight:600}
.total{padding:22px 4px 6px}
.total small{color:var(--sub)}
.total b{display:block;font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.mrow{display:flex;gap:18px;color:var(--sub);font-size:13px}
.mrow span b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{font-size:22px;width:34px;text-align:center}
.row .mid{flex:1;min-width:0}
.row .mid div:first-child{font-weight:600}
.row .mid div+div{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.neg,.exp{color:var(--out)}.inc{color:var(--in)}
.empty{padding:22px;text-align:center;color:var(--sub)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0 9px;font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
nav button i{display:block;font-style:normal;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--card);font-weight:700}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 2px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.cats button.on{border-color:var(--acc);outline:2px solid var(--acc)}
.cats button i{display:block;font-style:normal;font-size:22px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;margin-top:16px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.sm{width:auto;padding:8px 14px;margin:0}
.del{border:0;background:none;color:var(--sub);cursor:pointer;font-size:16px}
.wset{display:grid;grid-template-columns:1fr 110px;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.wset:last-child{border-bottom:0}
textarea{height:130px;font-size:12px}
.note{font-size:12px;color:var(--sub);margin:6px 2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--acc)}.bar.over i{background:var(--out)}
.q{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.q button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.crow{display:flex;gap:4px;align-items:center;padding:8px 8px;border-bottom:1px solid var(--line)}.crow input{padding:7px 4px}.crow .e{width:42px;text-align:center}.crow .n{flex:1;min-width:0}.crow .b{width:72px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}#lq{grid-column:1/3}
.mn{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.mn button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
.seg button{font-size:13px;padding:8px 0}
.warn{background:var(--card);border:1px solid var(--out);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="新增一筆">+</button>
<nav><div id="nav"></div></nav>
<script>
var EXP=[["🍜","餐飲"],["🚇","交通"],["🛒","日用品"],["🎮","娛樂"],["👕","服飾"],["🏠","居住"],["💊","醫療"],["📚","學習"],["📱","通訊"],["🎁","禮物"],["📈","投資成本"],["🧾","其他"]];
var INC=[["💼","薪資"],["🧧","獎金"],["💰","利息股利"],["↩️","退款"],["🧾","其他"]];
var WL=[["中信","bank"],["中信美金戶","usd"],["台新","bank"],["兆豐","bank"],["LinePay Money","bank"],["國泰銀行","bank"],["國泰信用卡","card"],["國泰證券戶","broker"]];
var S=null,tab="home";
try{S=JSON.parse(localStorage.getItem("ledger_v1"))}catch(e){}
if(!S||!S.wallets){S={wallets:WL.map(function(w,i){return{id:"w"+i,name:w[0],type:w[1],cur:w[1]=="usd"?"USD":"TWD",init:0}}),tx:[]}}
function mig(){if(!S.cats)S.cats={exp:EXP.slice(),inc:INC.slice()};if(!S.budgets)S.budgets={};if(!S.stocks)S.stocks=[];
if(!S.cc)S.cc={stmt:26,due:3,debit:(S.wallets.filter(w=>w.name=="國泰銀行")[0]||S.wallets[0]).id};
if(S.fx===undefined)S.fx=0;if(S.bk===undefined)S.bk="";if(!S.bkd)S.bkd=1;if(!S.snap)S.snap={};
if(!S.rec){var uw=S.wallets.filter(w=>w.cur=="USD")[0];if(!S.cats.exp.some(c=>c[1]=="保險"))S.cats.exp.push(["🛡️","保險"]);S.rec=[{id:1,name:"保險（年繳）",m:12,d:31,lead:14,w:uw?uw.id:S.wallets[0].id,cat:"保險",done:0}]}}
mig();
var L={q:"",w:"",c:"",m:""},RM=today().slice(0,7);
function save(){try{localStorage.setItem("ledger_v1",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Math.round(n*100)/100==Math.round(n)?Math.round(n).toLocaleString("en-US"):(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:2})}
function W(id){return S.wallets.filter(function(w){return w.id==id})[0]}
function bal(w){var b=+w.init||0;S.tx.forEach(function(t){if(t.type=="inc"&&t.w==w.id)b+=t.amt;if(t.type=="exp"&&t.w==w.id)b-=t.amt;if(t.type=="tr"){if(t.w==w.id)b-=t.amt;if(t.to==w.id)b+=(t.amt2||t.amt)}if(t.w==w.id)b+=cashOf(t);});return b}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function icon(t){if(t.type=="tr")return"🔁";if(t.type=="buy")return"📈";if(t.type=="sell")return"📉";if(t.type=="div")return"💵";var l=t.type=="exp"?S.cats.exp.concat(EXP):S.cats.inc.concat(INC);for(var i=0;i<l.length;i++)if(l[i][1]==t.cat)return l[i][0];return"🧾"}
function txRow(t){if(t.type=="buy"||t.type=="sell"||t.type=="div")return sRow(t);var w=W(t.w),sign=t.type=="inc"?"+":t.type=="exp"?"-":"";
var sub=t.type=="tr"?esc(w&&w.name)+" → "+esc((W(t.to)||{}).name):esc(w&&w.name);
return'<div class="row"><div class="ic">'+icon(t)+'</div><div class="mid"><div>'+esc(t.type=="tr"?"轉帳":t.cat)+(t.note?" · "+esc(t.note):"")+'</div><div>'+t.date+" · "+sub+'</div></div><div class="amt '+t.type+'">'+sign+fmt(t.amt)+'</div><button class="del" data-del="'+t.id+'" aria-label="刪除">✕</button></div>'}
function render(){
var h="";
if(tab=="home"){
var tw=0,usd=[],m=today().slice(0,7),mi=0,me=0;
S.wallets.forEach(function(w){var b=bal(w);if(w.cur=="TWD")tw+=b;else{tw+=b*(S.fx||0);usd.push(w.name+" "+fmt(b)+" "+w.cur)}});
var mv=stockMV();tw+=mv;S.tx.forEach(function(t){if(t.date.slice(0,7)==m){mi+=incOf(t);me+=costOf(t)}});
h+='<div class="total"><small>總資產（台幣）</small><b>'+fmt(tw)+'</b>'+(usd.length?'<small>'+(S.fx?'含外幣折合（匯率 '+S.fx+'）：':'外幣尚未設定匯率，未計入：')+esc(usd.join("、"))+'</small>':"")+'</div>';
h+=(mv?'<div class="note">含股票市值 '+fmt(mv)+'</div>':"")+'<div class="mrow"><span>本月收入 <b class="inc">'+fmt(mi)+'</b></span><span>本月支出 <b class="exp">'+fmt(me)+'</b></span></div>';
h+=banners();var spm=spentBy(m),bw=S.cats.exp.filter(c=>S.budgets[c[1]]>0&&(spm[c[1]]||0)>=S.budgets[c[1]]*.8);
if(bw.length)h+='<div class="warn">⚠️ 預算提醒（本月）<br>'+bw.map(c=>esc(c[0]+c[1])+' 已用 '+fmt(spm[c[1]])+' / '+fmt(S.budgets[c[1]])).join('<br>')+'</div>';
h+='<h2>錢包</h2><div class="card">';
S.wallets.forEach(function(w){var b=bal(w);h+='<div class="row"><div class="mid"><div>'+esc(w.name)+'</div><div>'+({bank:"帳戶",usd:"外幣帳戶",card:"信用卡（負數＝待繳）",broker:"證券戶現金"})[w.type]+'</div></div><div class="amt '+(b<0?"neg":"")+'">'+(w.cur=="USD"?"US$ ":"")+fmt(b)+'</div></div>'});
h+='</div><h2>最近記錄</h2><div class="card">';
var r=S.tx.slice().sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:b.id-a.id}).slice(0,6);
h+=r.length?r.map(txRow).join(""):'<div class="empty">還沒有記錄，按右下角的 + 開始記第一筆。</div>';
h+="</div>";
}else if(tab=="stocks"){
var rs=S.stocks.map(x=>({s:x,p:pos(x.code)})).filter(r=>r.p.q>0),mv2=0,cost=0;rs.forEach(r=>{mv2+=r.p.q*(+r.s.px||0);cost+=r.p.q*r.p.a});
h+='<div class="total"><small>股票市值</small><b>'+fmt(mv2)+'</b></div><div class="mrow"><span>成本 <b>'+fmt(cost)+'</b></span><span>未實現損益 <b class="'+(mv2>=cost?"inc":"exp")+'">'+fmt(mv2-cost)+'</b></span></div>';
h+='<h2>持股（在右側填入今日收盤價）</h2><div class="card">';
h+=rs.length?rs.map(r=>{var x=r.s,q=r.p.q,a=r.p.a,v=q*(+x.px||0),pl=v-q*a;return'<div class="row"><div class="mid"><div>'+esc(x.code+(x.name!=x.code?" "+x.name:""))+'</div><div>'+fmt(q)+' 股 · 均價 '+fmt(a)+'</div><div>'+(x.px?'市值 '+fmt(v)+' · <span class="'+(pl>=0?"inc":"exp")+'">'+(pl>=0?"+":"")+fmt(pl)+'</span>':'請輸入收盤價')+(x.pxd?' · '+x.pxd.slice(5):'')+'</div></div><input type="number" inputmode="decimal" step="any" style="width:84px;padding:6px;text-align:right" data-px="'+esc(x.code)+'" value="'+(x.px||"")+'" placeholder="收盤價"><button class="del" data-hold="'+esc(x.code)+'" aria-label="修改">✎</button><button class="del" data-sdel="'+esc(x.code)+'" aria-label="刪除">✕</button></div>'}).join(""):'<div class="empty">還沒有持股。按下方新增現有持股，或用 + 記一筆買股。</div>';
h+='</div><button class="btn ghost" data-hold="">＋ 新增現有持股</button><p class="note">均價含買進手續費；手續費和證交稅會計入報表的「投資成本」。賣出後的已實現損益目前沒有統計。</p>';
}else if(tab=="report"){
var sp=spentBy(RM),tot=0,inc=0;Object.keys(sp).forEach(k=>tot+=sp[k]);S.tx.forEach(t=>{if(t.date.slice(0,7)==RM)inc+=incOf(t)});
h+='<div class="mn"><button data-m="-1">‹</button><h2 style="margin:0;color:var(--ink)">'+RM.replace("-","年")+'月</h2><button data-m="1">›</button></div>';
h+='<div class="mrow" style="margin-top:12px"><span>收入 <b class="inc">'+fmt(inc)+'</b></span><span>支出 <b class="exp">'+fmt(tot)+'</b></span><span>結餘 <b>'+fmt(inc-tot)+'</b></span></div>';
h+='<h2>支出分類與預算</h2><div class="card">';
var ks=Object.keys(sp);Object.keys(S.budgets).forEach(k=>{if(S.budgets[k]>0&&ks.indexOf(k)<0)ks.push(k)});ks.sort((a,b)=>(sp[b]||0)-(sp[a]||0));
h+=ks.length?ks.map(k=>{var v=sp[k]||0,lim=S.budgets[k]>0?S.budgets[k]:0,pc=lim?Math.min(100,v/lim*100):(tot?v/tot*100:0);return'<div class="row"><div class="ic">'+icon({type:"exp",cat:k})+'</div><div class="mid"><div>'+esc(k)+'</div><div class="bar '+(lim&&v>lim?"over":"")+'"><i style="width:'+pc+'%"></i></div></div><div class="amt '+(lim&&v>lim?"neg":"")+'">'+fmt(v)+(lim?' / '+fmt(lim):'')+'</div></div>'}).join(""):'<div class="empty">這個月還沒有支出記錄。</div>';
var ms=[5,4,3,2,1,0].map(i=>mshift(RM,-i)),vs=ms.map(mexp),mx=Math.max.apply(null,vs.concat(1));
h+='</div><h2>近 6 個月支出</h2><div class="card" style="padding:14px"><div style="display:flex;gap:8px;align-items:flex-end">'+ms.map((m,i)=>'<div style="flex:1;text-align:center;font-size:11px;color:var(--sub)"><div>'+(vs[i]?fmt(vs[i]):"")+'</div><div style="height:'+Math.max(2,vs[i]/mx*80)+'px;background:'+(m==RM?"var(--acc)":"var(--line)")+';border-radius:4px 4px 0 0"></div>'+m.slice(5)+'月</div>').join("")+'</div></div>';
h+=trend();
}else if(tab=="list"){
var wo=S.wallets.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join(""),co=catNames().map(c=>'<option>'+esc(c)+'</option>').join("");
h+='<h2>搜尋與篩選</h2><div class="fl"><input id="lq" placeholder="搜尋備註或分類" value="'+esc(L.q)+'"><select id="lw2"><option value="">全部錢包</option>'+wo+'</select><select id="lc"><option value="">全部分類</option>'+co+'</select><input type="month" id="lm" value="'+L.m+'"></div><div class="card" id="res">';
var a=S.tx.slice().sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:b.id-a.id});
h+=a.length?a.map(txRow).join(""):'<div class="empty">目前沒有明細。</div>';h+="</div>";
}else{
h+='<h2>錢包期初餘額</h2><p class="note">輸入你開始記帳當下各錢包的餘額。信用卡已刷未繳的金額請填負數。</p><div class="card">';
S.wallets.forEach(function(w){h+='<div class="wset"><div><input data-wn="'+w.id+'" value="'+esc(w.name)+'" style="font-weight:600;padding:6px"><div class="note" style="margin:2px 0 0">'+w.cur+' <button class="del" style="font-size:12px" data-wdel="'+w.id+'">刪除</button></div></div><input type="number" inputmode="decimal" step="any" data-init="'+w.id+'" value="'+(+w.init||0)+'"></div>'});
h+='</div><button class="btn ghost" data-wadd="1">＋ 新增錢包</button>'+setExtra()+catEditor()+'<h2>備份與還原</h2><p class="note">資料只存在這個瀏覽器裡，請定期備份。複製下方文字存到記事本或雲端筆記，需要時貼回來還原。</p>';
h+='<div class="note">上次備份：'+(S.bk||"尚未備份")+'</div><label>幾天沒備份就在首頁提醒</label><input type="number" min="1" data-sf="bkd" value="'+S.bkd+'"><button class="btn" data-bk="1">備份（存到檔案／雲端硬碟）</button><label>從備份檔還原</label><input type="file" id="impf" accept=".json,application/json"><label>或使用文字備份</label><textarea id="bk" readonly></textarea><button class="btn ghost" id="cpb">複製完整備份</button><button class="btn ghost" id="csv">顯示 CSV（可貼到 Excel）</button>';
h+='<label>還原：貼上備份文字</label><textarea id="imp" placeholder="貼上之前複製的備份"></textarea><button class="btn ghost" id="doimp">還原這份備份</button>';
}
$("#app").innerHTML=h;
$("#nav").innerHTML=[["home","🏠","首頁"],["list","🧾","明細"],["report","📊","報表"],["stocks","📈","股票"],["set","⚙️","設定"]].map(function(x){return'<button data-tab="'+x[0]+'" class="'+(tab==x[0]?"on":"")+'"><i>'+x[1]+'</i>'+x[2]+'</button>'}).join("");
snap();if(tab=="set")$("#bk").value=JSON.stringify(S);
if(tab=="list"){$("#lw2").value=L.w;$("#lc").value=L.c;fillRes()}
}
function $(s){return document.querySelector(s)}
var F=null;
function openSheet(){
F={type:"exp",cat:"餐飲",w:S.wallets[0].id,to:S.wallets[1].id,date:today()};

function mshift(s,d){var p=s.split("-"),dt=new Date(+p[0],+p[1]-1+d,1);return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)}

function cashOf(t){return t.type=="buy"?-(t.qty*t.price+(t.fee||0)):t.type=="sell"?t.qty*t.price-(t.fee||0)-(t.tax||0):t.type=="div"?(t.cash||0):0}
function fxOf(t){return(W(t.w)||{}).cur=="USD"?(S.fx||0):1}
function incOf(t){return t.type=="inc"?t.amt*fxOf(t):t.type=="div"?(t.cash||0):0}
function costOf(t){return t.type=="exp"?t.amt*fxOf(t):(t.type=="buy"||t.type=="sell")?(t.fee||0)+(t.tax||0):0}
function pos(code){var s=S.stocks.filter(x=>x.code==code)[0]||{},q=+s.q0||0,a=+s.a0||0;
S.tx.filter(t=>t.code==code).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id).forEach(t=>{var n;
if(t.type=="buy"){n=q+t.qty;a=n?(q*a+t.qty*t.price+(t.fee||0))/n:0;q=n}else if(t.type=="sell")q-=t.qty;else if(t.type=="div"&&t.shares){n=q+t.shares;a=n?q*a/n:0;q=n}});
return{q:q,a:a}}
function stockMV(){var v=0;S.stocks.forEach(x=>v+=pos(x.code).q*(+x.px||0));return v}
function sRow(t){var w=W(t.w)||{},a=cashOf(t),s=S.stocks.filter(x=>x.code==t.code)[0],nm=t.code+(s&&s.name!=t.code?" "+s.name:"");
var ti=t.type=="div"?"股利 "+nm+(t.shares?" 配股 "+fmt(t.shares):""):(t.type=="buy"?"買進 ":"賣出 ")+nm+" "+fmt(t.qty)+" 股 @"+fmt(t.price);
var fe=(t.fee||t.tax)?" · 費稅 "+fmt((t.fee||0)+(t.tax||0)):"";
return'<div class="row"><div class="ic">'+icon(t)+'</div><div class="mid"><div>'+esc(ti)+(t.note?" · "+esc(t.note):"")+'</div><div>'+t.date+" · "+esc(w.name)+fe+'</div></div>'+(a?'<div class="amt '+(a<0?"exp":"inc")+'">'+(a>0?"+":"-")+fmt(Math.abs(a))+'</div>':"")+'<button class="del" data-del="'+t.id+'" aria-label="刪除">✕</button></div>'}

function totalTW(){var t=0;S.wallets.forEach(w=>{var b=bal(w);t+=w.cur=="TWD"?b:b*(S.fx||0)});return t+stockMV()}
function snap(){var t=Math.round(totalTW()),d=today();if(!t&&S.snap[d]===undefined)return;if(S.snap[d]!==t){S.snap[d]=t;save()}}
function trend(){var k=Object.keys(S.snap).sort().slice(-90),h='<h2>資產趨勢</h2><div class="card" style="padding:14px">';
if(k.length<2)return h+'<div class="empty" style="padding:6px">每天打開 app 會自動記下總資產，累積 2 天以上就會出現曲線。</div></div>';
var v=k.map(x=>S.snap[x]),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=mx-mn||1;
var pts=v.map((y,i)=>(i/(v.length-1)*290+5).toFixed(1)+","+(105-(y-mn)/r*90).toFixed(1)).join(" ");
return h+'<svg viewBox="0 0 300 120" style="width:100%;height:auto"><polyline points="'+pts+'" fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="mrow" style="justify-content:space-between"><span>'+k[0].slice(5)+'　'+fmt(v[0])+'</span><span>'+k[k.length-1].slice(5)+'　'+fmt(v[v.length-1])+'</span></div></div>'}

if(t.dataset.hold!==undefined)return openHold(t.dataset.hold);
if(t.dataset.sdel){var c=t.dataset.sdel;if(S.tx.some(x=>x.code==c)){alert("這檔有買賣或股利記錄，請先到明細刪除那些記錄");return}if(confirm("刪除持股 "+c+"？")){S.stocks=S.stocks.filter(x=>x.code!=c);save();render()}return}
if(t.id=="hs"){var c=$("#hc").value.trim();if(!c)return;var o=S.stocks.filter(x=>x.code==c)[0];if(!o){o={code:c,px:0};S.stocks.push(o)}o.name=$("#hn").value.trim()||o.name||c;o.q0=parseFloat($("#hq").value)||0;var ia=parseFloat($("#ha").value)||0,ifee=parseFloat($("#hf").value)||0,it=parseFloat($("#ht").value)||0;o.in={a:ia,f:ifee,t:it};o.a0=o.q0?(it>0?it:ia*o.q0+ifee)/o.q0:0;save();closeSheet();render();return}
if(t.dataset.pay){var c=cardInfo();openSheet();F.type="tr";drawCats();$("#fw").value=c.dw.id;$("#fto").value=c.w.id;$("#fa").value=Math.round(c.billed*100)/100;$("#fd").value=c.dueS<=today()?c.dueS:today();$("#fn").value="信用卡繳款";return}
if(t.dataset.rok!==undefined){var r=S.rec[+t.dataset.rok],a=parseFloat($("#ra"+t.dataset.rok).value);if(!(a>0)){$("#ra"+t.dataset.rok).focus();return}var d=recDue(r);S.tx.push({id:Date.now(),type:"exp",amt:a,w:r.w,cat:r.cat,note:r.name,date:ymd(d.dt)});r.done=d.dy;save();render();return}
if(t.dataset.rskip!==undefined){var r=S.rec[+t.dataset.rskip];r.done=recDue(r).dy;save();render();return}
if(t.dataset.clrsnap){if(confirm("清除所有資產趨勢紀錄？")){S.snap={};snap();render()}return}
if(t.dataset.bk){dlBackup();return}
if(t.dataset.wadd){var bg=document.createElement("div");bg.className="sheet-bg";bg.id="sbg";bg.innerHTML='<div class="sheet"><h2 style="margin-top:0">新增錢包</h2><label>名稱</label><input id="wn" placeholder="例如：玉山"><label>類型</label><select id="wt"><option value="bank">銀行帳戶／電子錢包</option><option value="card">信用卡</option><option value="broker">證券戶</option></select><label>幣別</label><select id="wc"><option value="TWD">台幣</option><option value="USD">美金（用「設定」的匯率折算）</option></select><label>目前餘額（信用卡已刷未繳請填負數）</label><input id="wi" type="number" inputmode="decimal" step="any"><button class="btn" id="wsave">新增</button><button class="btn ghost" id="fx">取消</button></div>';document.body.appendChild(bg);return}
if(t.id=="wsave"){var n=$("#wn").value.trim();if(!n){$("#wn").focus();return}var cu=$("#wc").value;S.wallets.push({id:"w"+Date.now(),name:n,type:cu=="USD"?"usd":$("#wt").value,cur:cu,init:parseFloat($("#wi").value)||0});save();closeSheet();render();return}
if(t.dataset.wdel){var id=t.dataset.wdel,w=W(id);if(S.wallets.length<2)return;if(S.tx.some(x=>x.w==id||x.to==id)){alert("這個錢包已有記錄，不能刪除。可以改名稱，或先到明細刪除相關記錄。");return}if(S.cc.debit==id||S.rec.some(r=>r.w==id)){alert("這個錢包正被信用卡扣款帳戶或定期項目使用，請先改掉那個設定。");return}if(confirm("刪除錢包「"+w.name+"」？")){S.wallets=S.wallets.filter(x=>x.id!=id);save();render()}return}
if(t.id=="fs")return saveTx();
if(t.id=="fx")return closeSheet();
if(t.id=="cpb"){var b=$("#bk");b.select();try{document.execCommand("copy");S.bk=today();save();t.textContent="已複製"}catch(x){t.textContent="請長按文字手動複製"}return}
if(t.id=="csv"){var b=$("#bk");b.value=csv();b.select();return}
if(t.id=="doimp"){try{var d=JSON.parse($("#imp").value);if(!d.wallets||!d.tx)throw 0;if(confirm("還原會覆蓋目前所有資料，確定嗎？")){S=d;mig();save();render()}}catch(x){alert("備份格式不正確，請確認有完整貼上")}}
});
document.addEventListener("change",function(e){var i=e.target.dataset&&e.target.dataset.init;if(i){W(i).init=parseFloat(e.target.value)||0;save()}});
document.addEventListener("input",function(e){if(e.target.id=="lq"){L.q=e.target.value;fillRes()}});
document.addEventListener("change",function(e){var d=e.target.dataset,id=e.target.id;
if(id=="impf"){var f=e.target.files[0];if(f){var rd=new FileReader();rd.onload=function(){try{var x=JSON.parse(rd.result);if(!x.wallets||!x.tx)throw 0;if(confirm("還原會覆蓋目前所有資料，確定嗎？")){S=x;mig();save();render()}}catch(z){alert("這不是正確的備份檔")}};rd.readAsText(f)}return}
if(id=="lw2"){L.w=e.target.value;fillRes()}if(id=="lc"){L.c=e.target.value;fillRes()}if(id=="lm"){L.m=e.target.value;fillRes()}
if(d&&d.wn){var v1=e.target.value.trim();if(v1){W(d.wn).name=v1;save()}else render();return}
if(d&&d.sf){var v0=e.target.value;if(d.sf=="bkd")S.bkd=Math.max(1,parseInt(v0)||1);else if(d.sf=="fx")S.fx=parseFloat(v0)||0;else if(d.sf=="debit")S.cc.debit=v0;else S.cc[d.sf]=parseInt(v0)||0;save();return}
if(d&&d.rf){S.rec[+d.ri][d.rf]=parseInt(e.target.value)||0;save();return}
if(d&&d.px){var o=S.stocks.filter(x=>x.code==d.px)[0];if(o){o.px=parseFloat(e.target.value)||0;o.pxd=today();save();render()}return}
if(!d||!d.cf)return;var l=S.cats[d.ct],c=l[+d.ci],v=e.target.value.trim();
if(d.cf=="e"){c[0]=v||"🧾";save()}
else if(d.cf=="b"){if(parseFloat(v)>0)S.budgets[c[1]]=parseFloat(v);else delete S.budgets[c[1]];save()}
else{if(!v||l.some((x,k)=>k!=+d.ci&&x[1]==v)){alert("分類名稱不能空白或重複");return render()}
var o=c[1];S.tx.forEach(t=>{if(t.type==d.ct&&t.cat==o)t.cat=v});if(S.budgets[o]!==undefined){S.budgets[v]=S.budgets[o];delete S.budgets[o]}c[1]=v;save()}});
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&e.target.id=="fa")saveTx()});
$("#fab").style.display="";
render();
</script>
</body>
</html>
